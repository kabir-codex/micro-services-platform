# Trimmed-down kube-prometheus-stack values tuned for a laptop-sized
# local cluster (small retention, small resource requests) while still
# exercising the real scrape/alert/dashboard pipeline.

grafana:
  enabled: true
  adminPassword: admin   # change before exposing beyond localhost
  service:
    type: ClusterIP
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          folder: Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      platform-overview:
        file: dashboards/platform-overview.json

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    additionalScrapeConfigs:
      - job_name: "platform-services"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["platform"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

alertmanager:
  enabled: true
  config:
    route:
      receiver: "null"
    receivers:
      - name: "null"
    # Wire a real receiver (Slack/PagerDuty/email) here for a production
    # deployment; left as a no-op for the local demo.
