# Plain-manifest infra: namespaces, Postgres, Redis, cert-manager issuer.
# Kept out of Helm since these rarely change and don't need templating.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kabir-codex/micro-services-platform.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
