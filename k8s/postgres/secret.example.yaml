# DO NOT commit real credentials. Copy this file to secret.yaml (gitignored),
# fill in real values, and apply it — or better, manage it via Sealed Secrets
# / External Secrets Operator / SOPS in a real environment.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: platform
type: Opaque
stringData:
  username: platform
  password: CHANGE_ME
  connection-string: "postgres://platform:CHANGE_ME@postgres.platform.svc.cluster.local:5432/platform"
  jdbc-url: "jdbc:postgresql://postgres.platform.svc.cluster.local:5432/platform"
