replicaCount: 2

image:
  repository: ghcr.io/kabir-codex/micro-services-platform/backend-java
  tag: "79b7df21b75ce2ec8247f076184817616c14f58d"
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: true
  host: platform.local
  path: /api/catalog
  tlsSecretName: platform-tls

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: jdbc-url
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: password
  - name: SPRING_REDIS_HOST
    value: "redis.platform.svc.cluster.local"

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  # Restrict ingress to traffic from the ingress-nginx namespace.
  enabled: true
