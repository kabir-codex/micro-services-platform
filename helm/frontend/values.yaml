replicaCount: 2

image:
  repository: ghcr.io/kabir-codex/micro-services-platform/frontend
  tag: "cb5148bfeaffbe74d17a4b1c066050bbaf389eba"
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: true
  host: platform.local
  tlsSecretName: platform-tls

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  # Restrict ingress to traffic from the ingress-nginx namespace.
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
