name: CI - Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["frontend/**"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values (GitOps trigger)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          python3 - <<'PY' "$SHORT_SHA"
import re, pathlib, sys
values = pathlib.Path("helm/frontend/values.yaml")
lines = values.read_text().splitlines(True)
new_tag = sys.argv[1]
in_image = False
for i, ln in enumerate(lines):
    if re.match(r"^image:\s*$", ln):
        in_image = True
    elif in_image and ln.strip() and not ln.startswith(" "):
        in_image = False
    if in_image and re.match(r"^\s+tag:", ln):
        lines[i] = re.sub(r"^(\s*tag:).*$", lambda m: m.group(1) + ' "' + new_tag + '"', ln)
values.write_text("".join(lines))
print(f"bumped image tag to {new_tag}")
PY
          git config user.name "kabir-devs"
          git config user.email "kabir-devs@users.noreply.github.com"
          git commit -am "ci: bump frontend image to ${SHORT_SHA}" || echo "no changes"
          git push
