name: CI - Backend (Java)

on:
  push:
    branches: [main]
    paths: ["backend-java/**", ".github/workflows/ci-backend-java.yml"]
  pull_request:
    paths: ["backend-java/**"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend-java

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: backend-java
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values (GitOps trigger)
        run: |
          python3 .github/scripts/bump-image-tag.py helm/backend-java/values.yaml "${GITHUB_SHA}"
          git config user.name "kabir-devs"
          git config user.email "kabir-devs@users.noreply.github.com"
          git commit -am "ci: bump backend-java image to ${GITHUB_SHA}" || echo "no changes"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done

  scan:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Scan the pushed image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Fail the build only on high/critical issues; medium and below are
          # noise for a demo platform but still visible in the job log.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
