name: CI - Backend (Node)

on:
  push:
    branches: [main]
    paths: ["backend-node/**", ".github/workflows/ci-backend-node.yml"]
  pull_request:
    paths: ["backend-node/**"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend-node

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: backend-node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values (GitOps trigger)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/tag: .*/tag: \"${SHORT_SHA}\"/" helm/backend-node/values.yaml
          git config user.name "kabir-devs"
          git config user.email "kabir-devs@users.noreply.github.com"
          git commit -am "ci: bump backend-node image to ${SHORT_SHA}" || echo "no changes"
          git push
