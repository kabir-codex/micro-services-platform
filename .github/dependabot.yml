# Weekly dependency updates. Grouped per ecosystem so one PR per area;
# the CI workflows gate each on their own test suite before a merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend-node
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /backend-java
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend-node
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend-java
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
